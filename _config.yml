# Site settings ---------------------------------------------------------------
# Restart `bundle exec jekyll serve` after editing this file.

title: Christon Ragavan
description: >-
  Senior Machine Learning Engineer in Munich, turning bold vision into lasting
  success in AI, Data and Cloud. Notes on machine learning, LLMs and data platforms.
url: "https://christon-ragavan.github.io"
baseurl: ""
lang: en

author:
  name: Christon Ragavan Nadar
  short_name: Christon
  role: Senior Machine Learning Engineer
  tagline: Turning bold vision into lasting success in AI, Data and Cloud
  company: Cloudflight
  location: Munich, Germany
  email: christonragavan@gmail.com
  photo: /assets/img/christon.jpg

# Profile links: leave a value empty to hide it.
social:
  github: christon-ragavan
  linkedin:          # e.g. christon-ragavan  (just the handle)
  scholar:           # full Google Scholar URL

# "Let's talk" page: paste your Cal.com / Calendly link to show a booking button.
booking_url:

# Images used when a link is shared (LinkedIn, Slack, X ...)
image: /assets/img/christon-og.jpg

# Build -----------------------------------------------------------------------
permalink: /:categories/:title/     # unchanged from the old site, so old links keep working
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  math_engine: mathjax
  syntax_highlighter: rouge
  auto_ids: true

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

include:
  - _pages

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - netlify.toml
  - LICENSE
  - vendor
  - .bundle

defaults:
  - scope: { path: "", type: posts }
    values:
      layout: post
      math: true
  - scope: { path: "" }
    values:
      layout: page
