---
layout: default
---
<section class="intro">
  <img class="portrait" src="{{ site.author.photo | relative_url }}" width="240" height="240" alt="Portrait of {{ site.author.short_name }}">
  <div class="intro-text">
    {{ content }}
    <p class="intro-actions">
      <a class="button" href="{{ '/about/' | relative_url }}">More about me</a>
      <a class="button quiet" href="{{ '/cv/' | relative_url }}">CV</a>
    </p>
  </div>
</section>

{% include signal.html %}

<section class="latest" aria-labelledby="latest-title">
  <div class="section-head">
    <h2 id="latest-title">Latest writing</h2>
    <a href="{{ '/blog/' | relative_url }}">All posts</a>
  </div>
  {%- assign posts = site.posts %}
  {%- assign limit = 5 %}
  {%- assign group_years = false %}
  {% include post-list.html %}
  {%- if site.posts.size == 0 %}
  <p class="empty">First post coming soon.</p>
  {%- endif %}
</section>
