---
layout: default
---
<article class="page">
  <header class="band">
    <div class="wrap{% if page.wide %} wrap-wide{% endif %} page-head">
      <h1>{{ page.title }}</h1>
      {%- if page.intro %}
      <p class="lede">{{ page.intro }}</p>
      {%- endif %}
    </div>
  </header>
  <div class="wrap{% if page.wide %} wrap-wide{% endif %} body">
    <div class="prose">
      {{ content }}
    </div>
  </div>
</article>
