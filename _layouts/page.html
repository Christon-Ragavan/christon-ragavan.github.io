---
layout: default
---
<article class="page">
  <header class="band">
    <div class="wrap wrap-wide page-head">
      <h1>{{ page.title }}</h1>
      {%- if page.intro %}
      <p class="lede">{{ page.intro }}</p>
      {%- endif %}
    </div>
  </header>
  <div class="wrap wrap-wide body">
    <div class="prose{% if page.full %} full{% endif %}">
      {{ content }}
    </div>
  </div>
</article>
